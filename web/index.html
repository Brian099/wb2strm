<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wb2strm · 本地媒体库</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo"><i></i>wb2strm · 本地媒体库</div>
  <div class="search">
    <input id="q" type="search" placeholder="搜索片名 / 演员 / 类型…" autocomplete="off">
  </div>
  <nav>
    <button data-tab="browse" class="active">浏览</button>
    <button data-tab="ops">运维</button>
  </nav>
</header>

<main>
  <!-- ==================== 浏览 ==================== -->
  <section id="browse">
    <div class="filters" id="chips"></div>
    <div class="filters" id="yearbar" style="margin-top:-8px"></div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none">没有找到内容，换个关键词或分类试试</div>
    <div class="pager" id="pager" style="display:none">
      <button id="prev">上一页</button>
      <span id="pageinfo"></span>
      <button id="next">下一页</button>
    </div>
  </section>

  <!-- ==================== 运维 ==================== -->
  <section id="ops" style="display:none">
    <div class="stat-row" id="stats"></div>

    <div class="panel">
      <h3><span class="status-dot" id="jobDot"></span>获取进度</h3>
      <p id="jobState">空闲</p>
      <div class="progress"><div class="progress-bar" id="progBar"></div></div>
      <p id="progText" style="margin:8px 0 0"></p>
      <p id="nextRunInfo" style="margin:10px 0 0">下次更新：计算中…</p>
    </div>

    <div class="panel">
      <h3>服务地址</h3>
      <p>写进 .strm 的地址，由影视软件（Emby / Jellyfin）去请求，不是浏览器。<br>影视软件<b>装在宿主机</b>可以用 <code>127.0.0.1</code>；<b>也跑在 Docker 里</b>就不行（那是它自己的容器），要用宿主机局域网 IP。改完点右边按钮重新生成。</p>
      <div class="field">
        <input id="setPublicBase" type="text" placeholder="http://192.168.1.110:8989">
        <button class="btn" id="btnSaveRegen" style="white-space:nowrap">保存并重新生成 STRM</button>
      </div>
    </div>

    <div class="panel">
      <h3>任务日志</h3>
      <div class="logbox" id="logbox">等待任务…</div>
    </div>
  </section>

</main>

<!-- ==================== 详情弹窗 ==================== -->
<div class="mask" id="detailMask">
  <div class="modal">
    <button class="close" data-close="detailMask">✕</button>
    <div class="detail-head">
      <div class="poster"><div class="ph">▶</div><img id="dPic" alt=""></div>
      <div style="flex:1;min-width:0">
        <h2 id="dName">—</h2>
        <div class="tags" id="dTags"></div>
        <div class="kv" id="dMeta"></div>
        <div class="plot" id="dPlot"></div>
      </div>
    </div>
    <div class="eps">
      <h3 id="dEpTitle">选集</h3>
      <div class="ep-grid" id="dEps"></div>
    </div>
  </div>
</div>

<!-- ==================== 播放弹窗 ==================== -->
<div class="mask" id="playerMask">
  <div class="modal">
    <div class="player-bar">
      <span class="t" id="pTitle">播放</span>
      <span class="q" id="pQual"></span>
      <button class="close" style="position:static;background:transparent" data-close="playerMask">✕</button>
    </div>
    <video id="video" controls playsinline></video>
    <div class="player-tip" id="pTip"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script src="app.js"></script>
</body>
</html>
