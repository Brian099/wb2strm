services:
  wb2strm:
    # 从 Docker Hub 拉取已发布镜像（linux/amd64 + linux/arm64 双架构）
    image: brian9909/wb2strm:latest
    # 想本地构建：把上面 image 行注释掉，换成下面这行，再 docker compose up -d --build
    # build: .
    container_name: wb2strm
    restart: unless-stopped
    ports:
      - "8989:8989"
    environment:
      TZ: Asia/Shanghai
      # ---- 站点（换域名只改这里，重启容器即可）----
      # 注意：JP_PUBLIC_BASE 是「本服务自己的地址」，JP_HOST 是「被抓取的站点地址」，别搞混
      JP_HOST: "https://www.jiabaide.cn"
      # 接口签名密钥，站点前端 bundle 里能查到；换域名/改版后如果报「应用签名失败」就更新这里
      JP_APP_KEY: "cb808529bae6b6be45ecfab29a4889bc"
      # ---- 服务地址（首次启动的默认值）----
      # 写进 .strm 的地址，填**宿主机局域网 IP**，内网不管影视软件装在宿主机还是容器都能用。
      # 之后在运维页改会覆盖这里的值（存数据库），改完点「保存并重新生成 STRM」。
      JP_PUBLIC_BASE: "http://192.168.1.147:8989"
      # ---- 抓取参数（改完重启容器生效）----
      # 增量时每个分类切片扫几页（0=全部；空库首次会自动全量）
      JP_PAGES: "5"
      # 增量时额外扫的排序，逗号分隔：
      #   sort=1 最新入库（默认）—— 能发现新剧
      #   sort=3 热播榜       —— 能发现**老剧的更新**（仙逆、凡人修仙传这类长连载）
      # 只扫 sort=1 的话，老 id 的连载剧排在几十页之后永远扫不到，集数会卡住不更新。
      # 留空则只扫 sort=1（旧行为）。
      JP_SORTS_EXTRA: "3"
      # 分集详情并发（站点会限流，NAS 上建议 2）
      JP_WORKERS: "2"
      # 请求间隔（秒）：列表页 / 详情页。被限流（99600）就调大这两个值
      JP_LIST_SLEEP: "0.5"
      JP_DETAIL_SLEEP: "0.3"
      # 自动更新间隔（小时），从上一次「跑完」开始计时
      JP_INTERVAL_HOURS: "24"
      # 启动后是否立刻跑一次（1=是，0=等第一个间隔到期）
      JP_BOOTSTRAP: "1"
      # 自动更新跑完是否顺带导出 STRM。
      # 默认 0（不导出）：主用 CMS 接口给飞牛影视/ext 用，库更新完就结束。
      # 需要给 Emby/Jellyfin 用 STRM 时，在运维页点「立即导出 STRM」手动导一次即可。
      JP_AUTO_EXPORT: "0"
      # 怀疑目录没抓全时设为 1：按全量跑一轮（断点续爬，不重复抓），跑完自动标记完成
      JP_FORCE_FULL: "0"
      # 播放方式（JP_PLAY_MODE）：
      #   relay  = 全部中继：任何网络环境都能播，视频流量走本服务转发
      #   auto   = 按客户端 IP 自动：内网 302 直连 CDN、外网中继（当前使用）
      #   direct = 全部直连：最省带宽，要求播放器与本服务同出口 IP
      # （不设置此项时代码默认 relay）
      #
      # 按你的外网接入方式选：
      #   DDNS + 端口映射  -> auto   （NAT 保留真实客户端 IP，内外网判断准确）
      #   frp 内网穿透     -> relay  （隧道拿不到真实 IP；写 auto 也会自动回退成中继，
      #                               效果等价，但直接写 relay 更明确）
      #   纯内网自用        -> direct （省掉全部视频带宽；NAS 挂代理/VPN 时改用 relay）
      JP_PLAY_MODE: "auto"
      # 工作线程数：中继模式下每路播放会占用线程，同时看的人多就调大
      JP_THREADS: "24"
      # 图片下载并发（手动勾选「下载海报」时生效）
      JP_IMAGE_WORKERS: "8"
      # 默认清晰度
      JP_DEFAULT_QUALITY: "1080"
      # 访问令牌：留空=不鉴权；非空时界面和接口都要带 ?token=xxx
      JP_TOKEN: ""
      # 苹果CMS 兼容接口的密钥：留空=公开。
      # 非空时接口地址变成 /api.php/provide/vod/k/<密钥>（**路径式**，不再支持 ?key=）。
      # 放路径里是因为很多采集端（如 fnmedia-ext 的分类深翻）会把查询串整段丢掉。
      # 建议只用字母、数字、下划线、短横线。
      JP_API_KEY: ""
      # 该接口 vod_play_from 显示的线路名
      JP_API_PLAY_FROM: "wb2strm"
      # CMS 接口每页条数（标准是 20，**接 fnmedia-ext 时不要动**）。
      # 原因：ext 用 `pagecount × 20` 估算能浏览多少部（PAGE_SIZE 写死在它的 catalog.py 里），
      # 而我们返回的 pagecount 会随本值变小 —— 调大反而让 ext 显示得更少：
      #   20  -> ext 显示 17500 部（电影/电视剧各封顶 250 页）
      #   50  -> ext 显示 11860 部
      #   100 -> ext 显示  7920 部
      # 想扩大 ext 的浏览范围，改它那边的 MAX_PAGES（250 -> 1200），不要改这里。
      JP_API_LIMIT: "20"
    volumes:
      # 数据库（剧集目录）
      - ./data:/app/data
      # STRM 导出目录，给 Emby / Jellyfin 挂载用
      - ./strm:/app/strm
    # 默认以 root 运行，方便直接写宿主机目录（NAS 上最常见的情况）。
    # 想用非 root：先 chown -R 1000:1000 ./data ./strm，再取消下面这行注释。
    # user: "1000:1000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
