services:
  wb2strm:
    # 从 Docker Hub 拉取已发布镜像（linux/amd64 + linux/arm64 双架构）
    image: brian9909/wb2strm:latest
    # 想本地构建：把上面 image 行注释掉，换成下面这行，再 docker compose up -d --build
    # build: .
    container_name: wb2strm
    restart: unless-stopped
    ports:
      - "8989:8989"
    environment:
      TZ: Asia/Shanghai
      # ---- 站点（换域名只改这里，重启容器即可）----
      # 注意：JP_PUBLIC_BASE 是「本服务自己的地址」，JP_HOST 是「被抓取的站点地址」，别搞混
      JP_HOST: "https://www.jiabaide.cn"
      # 接口签名密钥，站点前端 bundle 里能查到；换域名/改版后如果报「应用签名失败」就更新这里
      JP_APP_KEY: "cb808529bae6b6be45ecfab29a4889bc"
      # ---- 服务地址（首次启动的默认值）----
      # 写进 .strm 的地址，填**宿主机局域网 IP**，内网不管影视软件装在宿主机还是容器都能用。
      # 之后在运维页改会覆盖这里的值（存数据库），改完点「保存并重新生成 STRM」。
      JP_PUBLIC_BASE: "http://192.168.1.147:8989"
      # ---- 抓取参数（改完重启容器生效）----
      # 增量时每个分类切片扫几页（0=全部；空库首次会自动全量）
      JP_PAGES: "5"
      # 分集详情并发（站点会限流，NAS 上建议 2）
      JP_WORKERS: "2"
      # 请求间隔（秒）：列表页 / 详情页。被限流（99600）就调大这两个值
      JP_LIST_SLEEP: "0.5"
      JP_DETAIL_SLEEP: "0.3"
      # 自动更新间隔（小时），从上一次「跑完」开始计时
      JP_INTERVAL_HOURS: "24"
      # 启动后是否立刻跑一次（1=是，0=等第一个间隔到期）
      JP_BOOTSTRAP: "1"
      # 怀疑目录没抓全时设为 1：按全量跑一轮（断点续爬，不重复抓），跑完自动标记完成
      JP_FORCE_FULL: "0"
      # 播放方式：1=中继（推荐，兼容性最好）；0=302 直连（省带宽，但要求播放器与本服务同出口 IP）
      JP_RELAY: "1"
      # 图片下载并发（手动勾选「下载海报」时生效）
      JP_IMAGE_WORKERS: "8"
      # 默认清晰度
      JP_DEFAULT_QUALITY: "1080"
      # 访问令牌：留空=不鉴权；非空时界面和接口都要带 ?token=xxx
      JP_TOKEN: ""
      # 苹果CMS 兼容接口（/api.php/provide/vod）的密钥：留空=公开
      JP_API_KEY: ""
      # 该接口 vod_play_from 显示的线路名
      JP_API_PLAY_FROM: "wb2strm"
    volumes:
      # 数据库（剧集目录）
      - ./data:/app/data
      # STRM 导出目录，给 Emby / Jellyfin 挂载用
      - ./strm:/app/strm
    # 默认以 root 运行，方便直接写宿主机目录（NAS 上最常见的情况）。
    # 想用非 root：先 chown -R 1000:1000 ./data ./strm，再取消下面这行注释。
    # user: "1000:1000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
